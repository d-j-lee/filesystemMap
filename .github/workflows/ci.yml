name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: viewer syntax
        if: runner.os == 'Linux'
        run: node --check viewer/app.js

  msrv:
    # Cargo.toml declares rust-version = "1.89"; this keeps the claim true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  gate:
    # The agent harness's gate (decision D-15) run on this repository, cargo-deny
    # included. The explicit steps above stay the gate of record: a change that weakens
    # `fsmap verify` cannot pass CI by grading itself.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the dogfood extra step needs history
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo build --release --locked
      - name: fsmap verify --mode full --strict
        run: ./target/release/fsmap verify . --mode full --strict

  dogfood:
    # fsmap analyses itself: new high-severity findings fail the build, and the report
    # is kept as an artifact for review.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: findings gate
        run: ./target/release/fsmap insights . -q --fail-on high
      - name: report
        run: ./target/release/fsmap report . -q -o fsmap-report.html
      - uses: actions/upload-artifact@v7
        with:
          name: fsmap-report
          path: fsmap-report.html
